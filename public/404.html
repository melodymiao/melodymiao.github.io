<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect
      // Encodes the path into a query string and redirects to index.html
      var path = window.location.pathname;
      window.location.replace(
        '/?p=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
